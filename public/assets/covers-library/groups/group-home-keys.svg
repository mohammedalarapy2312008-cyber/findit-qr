<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F1827"/>
      <stop offset="100%" stop-color="#1F2C40"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.34"/>
      <stop offset="65%" stop-color="#FBBF24" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#19B5A5" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#19B5A5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#19B5A5"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#040914" flood-opacity="0.55"/>
    </filter>
    <pattern id="pat" width="60" height="60" patternUnits="userSpaceOnUse"><circle cx="30" cy="30" r="24" fill="none" stroke="#FBBF24" stroke-width="0.9" opacity="0.08"/></pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#pat)"/>
  <circle cx="560" cy="170" r="270" fill="url(#glow1)"/>
  <circle cx="240" cy="430" r="230" fill="url(#glow2)"/>
  <ellipse cx="400" cy="495" rx="235" ry="26" fill="#030712" opacity="0.46"/>
  <g filter="url(#softShadow)">
    
      <polygon points="400,118 594,256 206,256" fill="url(#accentGrad)"/>
      <rect x="242" y="256" width="316" height="214" rx="24" fill="#122136" stroke="#FBBF24" stroke-width="4"/>
      <rect x="358" y="346" width="84" height="124" rx="18" fill="#0B1320" stroke="#19B5A5" stroke-width="3.5"/>
      <circle cx="420" cy="410" r="7" fill="#FBBF24"/>
      <circle cx="304" cy="316" r="24" fill="#FBBF24" opacity="0.88"/>
      <circle cx="496" cy="316" r="24" fill="#19B5A5" opacity="0.88"/>
    
  </g>
  <rect x="26" y="26" width="748" height="548" rx="26" fill="none" stroke="#FBBF24" stroke-opacity="0.16" stroke-width="1.5"/>
