    </filter>
    <pattern id="pat" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38BDF8" stroke-width="0.8" opacity="0.09"/></pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
