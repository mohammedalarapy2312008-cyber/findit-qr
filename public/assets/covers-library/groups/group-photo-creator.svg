    </filter>
    <pattern id="pat" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#F97316" opacity="0.13"/></pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
