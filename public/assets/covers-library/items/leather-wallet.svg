<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#151926"/>
      <stop offset="100%" stop-color="#2B221B"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.34"/>
      <stop offset="65%" stop-color="#F59E0B" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#19B5A5" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#19B5A5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#19B5A5"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#040914" flood-opacity="0.55"/>
    </filter>
    <pattern id="pat" width="32" height="32" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="32" stroke="#F59E0B" stroke-width="1" opacity="0.09"/></pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#pat)"/>
  <circle cx="560" cy="170" r="270" fill="url(#glow1)"/>
  <circle cx="240" cy="430" r="230" fill="url(#glow2)"/>
  <ellipse cx="400" cy="495" rx="235" ry="26" fill="#030712" opacity="0.46"/>
  <g filter="url(#softShadow)">
    
      <rect x="235" y="160" width="290" height="165" rx="22" fill="#19B5A5" transform="rotate(-8 380 240)"/>
      <rect x="255" y="175" width="70" height="44" rx="8" fill="#FDE68A" opacity="0.85" transform="rotate(-8 290 197)"/>
      <rect x="200" y="218" width="400" height="248" rx="34" fill="#3B2417" stroke="#F59E0B" stroke-width="4"/>
      <rect x="218" y="236" width="364" height="212" rx="24" fill="none" stroke="#F59E0B" stroke-dasharray="10 8" stroke-opacity="0.55" stroke-width="2.5"/>
      <rect x="466" y="302" width="144" height="80" rx="22" fill="#4C2E1E" stroke="#F59E0B" stroke-width="4"/>
      <circle cx="512" cy="342" r="14" fill="url(#accentGrad)"/>
    
  </g>
  <rect x="26" y="26" width="748" height="548" rx="26" fill="none" stroke="#F59E0B" stroke-opacity="0.16" stroke-width="1.5"/>
</svg>