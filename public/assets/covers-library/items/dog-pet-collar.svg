    <pattern id="pat" width="60" height="60" patternUnits="userSpaceOnUse"><circle cx="30" cy="30" r="24" fill="none" stroke="#22C55E" stroke-width="0.9" opacity="0.08"/></pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
